# Rebuilds the pages in public/ whenever the site content or the templates change,
# e.g. after a save in /admin. Cloudflare then deploys the new commit.
name: Build site

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "build.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python build.py
      - name: Commit the rebuilt pages
        run: |
          git add -A public
          if git diff --cached --quiet; then
            echo "Pages already up to date."
            exit 0
          fi
          git config user.name "site-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild site from content"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
